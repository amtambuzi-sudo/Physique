<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Training Log</title>
<style>
  :root{
    --bg: #1e1c1a;
    --panel: #27251f;
    --panel-2: #322f28;
    --border: #3d392f;
    --text: #f2eee6;
    --text-muted: #a29c8e;
    --accent: #f0a83c;
    --accent-soft: rgba(240,168,60,0.16);
    --fire: #ff6b4a;
    --fire-soft: rgba(255,107,74,0.14);
    --success: #8aab6f;
    --success-soft: rgba(138,171,111,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:40px;
  }
  header{
    padding:20px 18px 12px; position:sticky; top:0; background:var(--bg); z-index:10;
    border-bottom:1px solid var(--border);
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between;}
  h1{font-size:19px; margin:0; font-weight:600; letter-spacing:-0.01em;}
  .date-sub{font-size:13px; color:var(--text-muted); margin-top:2px;}
  .week-nav{display:flex; align-items:stretch; gap:4px; margin-top:14px;}
  .week-arrow{
    width:24px; flex-shrink:0; background:transparent; border:none; color:var(--text-muted);
    font-size:18px; padding:0; cursor:pointer;
  }
  .week-strip{display:flex; gap:4px; flex:1; min-width:0;}
  .week-pill{
    flex:1; min-width:0; text-align:center; padding:6px 0; border-radius:9px;
    background:var(--panel); border:1px solid var(--border);
    color:var(--text-muted); cursor:pointer;
  }
  .week-pill .dow{font-size:10px;}
  .week-pill .dom{font-size:14px; font-weight:600; margin-top:1px;}
  .week-pill.is-today .dow{color:var(--accent); font-weight:600;}
  .week-pill.done{background:var(--success-soft); border-color:var(--success); color:var(--success);}
  .week-pill.selected{border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .workout-select-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .workout-select-row label{font-size:12px; color:var(--text-muted); flex-shrink:0;}
  .select-wrap{position:relative; flex:1; min-width:0;}
  .select-wrap::after{
    content:"▾"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color:var(--accent); font-size:12px; pointer-events:none;
  }
  #workoutSelect{padding:9px 32px 9px 12px; color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:600;}
  #workoutSelect option{color:var(--text); background:var(--panel); font-weight:400;}

  nav{display:flex; gap:5px; padding:14px 14px 0;}
  .tab{
    flex:1; text-align:center; padding:8px 0; border-radius:9px;
    font-size:11.5px; color:var(--text-muted); background:transparent;
    border:1px solid var(--border); cursor:pointer; white-space:nowrap;
  }
  .tab.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}

  main{padding:16px 18px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px; margin-bottom:12px;
  }
  .select-row{margin-bottom:14px;}

  .logging-for{font-size:12.5px; color:var(--accent); text-align:center; margin-bottom:10px; font-weight:500;}

  .hardcore-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel); border:1.5px solid var(--border); border-radius:12px;
    padding:11px; margin-bottom:14px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .hardcore-toggle .hc-label{font-size:13.5px; font-weight:600; color:var(--text-muted);}
  .hardcore-toggle.on{border-color:var(--fire); background:var(--fire-soft);}
  .hardcore-toggle.on .hc-label{color:var(--fire);}
  .hc-badge{
    font-size:10px; font-weight:700; color:var(--fire); border:1px solid var(--fire);
    border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:middle;
  }
  .rest-body{font-size:13.5px; color:var(--text-muted); line-height:1.5;}
  .rest-note{
    text-align:center; font-size:12.5px; color:var(--text-muted); background:var(--panel);
    border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; line-height:1.5;
  }
  .rec-field{margin-bottom:12px;}
  .rec-field input, .rec-field select{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:11px 12px; color:var(--text); font-size:15px;
  }
  select{
    width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; font-size:15px; appearance:none;
  }
  label.field-label{font-size:12px; color:var(--text-muted); display:block; margin-bottom:6px;}

  .exercise-item{border-bottom:1px solid var(--border);}
  .exercise-item:last-child{border-bottom:none;}
  .exercise-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; gap:10px;
  }
  .exercise-info{
    flex:1; min-width:0; cursor:pointer;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  .exercise-item.pressing .exercise-info{opacity:.55; transition:opacity .45s;}
  .exercise-info:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
  .exercise-name{font-size:14.5px; font-weight:500;}
  .howto-chev{display:inline-block; color:var(--text-muted); font-size:11px; margin-left:4px; transition:transform .15s;}
  .exercise-item.open .howto-chev{transform:rotate(180deg);}
  .howto{display:flex; gap:12px; align-items:flex-start; padding:0 0 12px;}
  .howto[hidden]{display:none;}
  .howto-fig{
    width:88px; height:88px; flex-shrink:0; background:var(--panel-2); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .howto-fig svg{width:70px; height:70px; stroke:var(--accent);}
  .howto-text{flex:1; min-width:0;}
  .howto-works{font-size:11.5px; color:var(--accent); margin-bottom:4px;}
  .howto-cue{font-size:13px; color:var(--text-muted); line-height:1.45;}
  .exercise-target{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .hc-hint{color:var(--fire);}
  .exercise-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}

  .check-wrap{position:relative; width:26px; height:26px; flex-shrink:0;}
  .check-wrap input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .checkmark{
    position:absolute; inset:0; border-radius:8px; border:1.5px solid var(--border);
    background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .check-wrap input:checked ~ .checkmark{background:var(--success-soft); border-color:var(--success);}
  .checkmark::after{
    content:""; width:12px; height:7px; border-left:2px solid var(--success); border-bottom:2px solid var(--success);
    transform:rotate(-45deg) translateY(-1px); opacity:0;
  }
  .check-wrap input:checked ~ .checkmark::after{opacity:1;}

  .section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:4px 0 8px;}
  .cardio-box{background:var(--panel-2); border-radius:10px; padding:10px 12px; margin-top:4px;}
  .cardio-title{font-size:14px; font-weight:500;}
  .cardio-detail{font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.4;}
  .cardio-check-row{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}

  .save-btn{
    width:100%; background:var(--accent); color:#1e1c1a; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:600; margin-top:6px; cursor:pointer;
  }
  .save-btn:active{opacity:0.85;}
  .saved-note{text-align:center; font-size:12.5px; color:var(--success); margin-top:8px; min-height:16px;}

  .hist-item{padding:12px 0; border-bottom:1px solid var(--border);}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .hist-day{font-size:14.5px; font-weight:600;}
  .hist-date{font-size:12px; color:var(--text-muted); margin-top:1px;}
  .hist-summary{font-size:12.5px; color:var(--text-muted); text-align:right;}
  .hist-details{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .hist-details.open{display:block;}
  .hist-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--text-muted);}
  .hist-row span:last-child{color:var(--text);}

  .backup-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px;}
  .ghost-btn{
    background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:10px 4px; font-size:13px; cursor:pointer; width:100%;
  }
  .ghost-btn:active{opacity:0.85;}
  .backup-text{
    width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:9px;
    padding:9px 10px; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; margin-bottom:6px;
  }

  .empty-state{text-align:center; color:var(--text-muted); font-size:13.5px; padding:30px 10px;}

  svg{width:100%; height:150px; display:block;}
  .chart-empty{text-align:center; color:var(--text-muted); font-size:13px; padding:30px 0;}
  .chart-caption{font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:4px;}
  .chart-title{font-size:14px; font-weight:600; margin-bottom:2px;}
  .chart-sub{font-size:12px; color:var(--text-muted); margin-bottom:8px;}
  .chart-box{position:relative;}
  .chart-box svg{height:auto;}
  .chart-box .hit{fill:transparent; cursor:pointer;}
  .chart-tip{
    position:absolute; pointer-events:none; transform:translate(-50%,-100%);
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:5px 8px; font-size:12px; color:var(--text); white-space:nowrap; display:none;
  }
  .trend-table{margin-top:8px; font-size:12px; color:var(--text-muted);}
  .trend-table summary{cursor:pointer;}
  .trend-table table{width:100%; border-collapse:collapse; margin-top:6px;}
  .trend-table td{padding:3px 0; border-bottom:1px solid var(--border);}
  .trend-table td:last-child{text-align:right; color:var(--text);}
  .comp-group{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:12px 0 4px;}
  .comp-group:first-of-type{margin-top:4px;}
  .comp-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px;}
  .comp-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .comp-meter{width:64px; height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; flex-shrink:0;}
  .comp-meter span{display:block; height:100%; background:var(--accent); border-radius:3px;}
  .comp-count{width:30px; text-align:right; color:var(--text-muted); flex-shrink:0;}

  .stat-row{display:flex; gap:10px; margin-bottom:14px;}
  .stat{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center;}
  .stat-num{font-size:20px; font-weight:700; color:var(--accent);}
  .stat-label{font-size:11px; color:var(--text-muted); margin-top:2px;}

  .nw-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .nw-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .nw-day{font-size:14.5px; font-weight:600;}
  .nw-date{font-size:12px; color:var(--accent);}
  .nw-ex{font-size:13px; color:var(--text-muted); padding:3px 0;}
  .nw-ex b{color:var(--text); font-weight:500;}
  .nw-cardio{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-muted);}

  .guide-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .guide-row:last-child{border-bottom:none;}
  .guide-icon-wrap{width:52px; height:52px; flex-shrink:0; background:var(--panel-2); border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .guide-icon-wrap svg{width:38px; height:38px; stroke:var(--accent);}
  .guide-info{flex:1; min-width:0;}
  .guide-name{font-size:14px; font-weight:600;}
  .guide-days{font-size:10.5px; color:var(--accent); margin:1px 0 3px;}
  .guide-works{font-size:11.5px; color:var(--text); margin-bottom:2px;}
  .guide-cue{font-size:12.5px; color:var(--text-muted); line-height:1.4;}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Training Log</h1>
    <div class="date-sub" id="todayLabel"></div>
  </div>
  <div class="week-nav">
    <button class="week-arrow" id="prevWeek" aria-label="Previous week">‹</button>
    <div class="week-strip" id="weekStrip"></div>
    <button class="week-arrow" id="nextWeek" aria-label="Next week">›</button>
  </div>
  <div class="workout-select-row">
    <label for="workoutSelect">Workout</label>
    <div class="select-wrap"><select id="workoutSelect"></select></div>
  </div>
</header>

<nav>
  <div class="tab active" data-tab="today">Today</div>
  <div class="tab" data-tab="nextweek">Next Wk</div>
  <div class="tab" data-tab="guide">Guide</div>
  <div class="tab" data-tab="history">Log</div>
  <div class="tab" data-tab="progress">Trend</div>
</nav>

<main>
  <section id="tab-today">
    <div class="logging-for" id="loggingForLabel"></div>
    <div class="rest-note" id="restNote" style="display:none;"></div>
    <div class="hardcore-toggle" id="hardcoreToggle">
      <span>🔥</span><span class="hc-label" id="hardcoreLabel">Hardcore Mode — off</span>
    </div>
    <div class="card" id="exerciseCard"></div>
    <div class="card" id="cardioCard"></div>
    <button class="save-btn" id="saveBtn">Save this log</button>
    <div class="saved-note" id="savedNote"></div>
  </section>

  <section id="tab-nextweek" style="display:none;">
    <div id="nextWeekWrap"></div>
  </section>

  <section id="tab-guide" style="display:none;">
    <div id="guideWrap"></div>
  </section>

  <section id="tab-history" style="display:none;">
    <div class="card" id="historyCard"></div>
    <div class="card" id="backupCard">
      <div class="section-label">Backup</div>
      <div class="backup-actions">
        <button class="ghost-btn" id="exportBtn">Export file</button>
        <button class="ghost-btn" id="copyBtn">Copy JSON</button>
        <button class="ghost-btn" id="importBtn">Import file</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <textarea class="backup-text" id="backupText" rows="3" placeholder="…or paste a backup here"></textarea>
      <button class="ghost-btn" id="importPasteBtn">Import pasted JSON</button>
      <div class="saved-note" id="backupNote"></div>
    </div>
  </section>

  <section id="tab-progress" style="display:none;">
    <div id="trendWrap"></div>
  </section>
</main>

<script>
const ACCENT = "#f0a83c";
// ---------- Program definition ----------
const PROGRAM = {
  monday: {
    label: "Full Body A",
    dayName: "Monday",
    exercises: [
      {id:"m1", name:"Goblet Squat (DB)", reps:"3 × 10", start:25, unit:"lb", equip:"db"},
      {id:"m2", name:"Chest Press (machine)", reps:"3 × 10", start:40, unit:"lb", equip:"machine"},
      {id:"m3", name:"Lat Pulldown (machine)", reps:"3 × 10", start:45, unit:"lb", equip:"machine"},
      {id:"m4", name:"Leg Extension", reps:"3 × 12", start:40, unit:"lb", equip:"machine"},
      {id:"m5", name:"Leg Curl (reverse leg extension)", reps:"3 × 12", start:35, unit:"lb", equip:"machine"},
      {id:"m6", name:"DB Hip Thrust / Glute Bridge", reps:"3 × 12", start:20, unit:"lb", equip:"db"},
      {id:"m7", name:"DB Romanian Deadlift", reps:"3 × 10", start:25, unit:"lb", equip:"db"}
    ],
    cardio: {name:"Treadmill HIIT finisher", detail:"6–8 rounds: 30 sec fast/incline, 90 sec walk recovery (~12 min total)"}
  },
  wednesday: {
    label: "Full Body B",
    dayName: "Wednesday",
    exercises: [
      {id:"w1", name:"DB Reverse Lunge", reps:"3 × 10/leg", start:20, unit:"lb", equip:"db"},
      {id:"w2", name:"DB Shoulder Press", reps:"3 × 10", start:15, unit:"lb", equip:"db"},
      {id:"w3", name:"Single-Arm Cable Row", reps:"3 × 10/side", start:30, unit:"lb", equip:"cable"},
      {id:"w9", name:"Cable Face Pull", reps:"3 × 12–15", start:20, unit:"lb", equip:"cable"},
      {id:"w6", name:"Cable Triceps Pushdown", reps:"3 × 12", start:25, unit:"lb", equip:"cable"},
      {id:"w10", name:"DB Overhead Triceps Extension", reps:"2 × 12", start:15, unit:"lb", equip:"db"},
      {id:"w7", name:"DB Bicep Curl", reps:"2 × 12", start:12, unit:"lb", equip:"db"},
      {id:"w8", name:"Plank", reps:"3 × 30–45 sec", start:null, unit:"sec", equip:"bodyweight"}
    ],
    cardio: {name:"Steady-state bike", detail:"15–20 min, level 1–3 — your comfort zone, build time before intensity"}
  },
  weekend: {
    label: "Full Body C",
    dayName: "Weekend (Sat or Sun)",
    exercises: [
      {id:"s1", name:"DB Romanian / Sumo Deadlift", reps:"3 × 10", start:30, unit:"lb", equip:"db"},
      {id:"s2", name:"Chest Press (machine)", reps:"3 × 10", start:40, unit:"lb", equip:"machine"},
      {id:"s3", name:"Lat Pulldown, wide grip", reps:"3 × 10", start:45, unit:"lb", equip:"machine"},
      {id:"s4", name:"Leg Extension", reps:"3 × 12", start:40, unit:"lb", equip:"machine"},
      {id:"s5", name:"Leg Curl (reverse leg extension)", reps:"3 × 12", start:35, unit:"lb", equip:"machine"},
      {id:"s6", name:"DB Lateral Raise", reps:"2 × 15", start:8, unit:"lb", equip:"db"},
      {id:"s7", name:"Cable Glute Kickback", reps:"3 × 12/side", start:15, unit:"lb", equip:"cable"}
    ],
    cardio: {name:"Run/walk intervals (treadmill)", detail:"Start 1 min run / 1 min walk × 8 (16 min). Add a run interval every 1–2 weeks as it feels manageable."}
  },
  recovery: {
    label: "Active Recovery",
    dayName: "Flex day",
    exercises: [
      {id:"r1", name:"Mobility / stretch flow", reps:"10 min", start:null, unit:"sec", equip:"bodyweight"}
    ],
    cardio: {name:"Easy bike or walk", detail:"20–30 min, level 1 — easy conversational pace, no intensity"}
  },
  kettlebell: {
    label: "Kettlebell + Mat",
    dayName: "Kettlebell Gym",
    exercises: [
      {id:"k1", name:"KB Goblet Squat", reps:"3 × 12", start:25, unit:"lb", equip:"kb"},
      {id:"k2", name:"KB Two-Hand Swing", reps:"3 × 15", start:25, unit:"lb", equip:"kb"},
      {id:"k3", name:"KB Single-Arm Row", reps:"3 × 10/side", start:20, unit:"lb", equip:"kb"},
      {id:"k4", name:"KB Single-Arm Overhead Press", reps:"3 × 8/side", start:15, unit:"lb", equip:"kb"},
      {id:"k5", name:"KB Romanian Deadlift", reps:"3 × 10", start:25, unit:"lb", equip:"kb"},
      {id:"k6", name:"KB Reverse Lunge", reps:"3 × 10/leg", start:20, unit:"lb", equip:"kb"},
      {id:"k7", name:"KB Halo", reps:"2 × 10/direction", start:10, unit:"lb", equip:"kb"},
      {id:"k8", name:"Plank", reps:"3 × 30–45 sec", start:null, unit:"sec", equip:"bodyweight"},
      {id:"k9", name:"Mat stretch / mobility flow", reps:"10 min", start:null, unit:"sec", equip:"bodyweight"}
    ],
    cardio: {name:"Optional finisher", detail:"5–10 min light cardio if the gym has it, or skip — the swings and circuit pace already cover conditioning."}
  },
  rest: {
    label: "Rest day",
    dayName: "Rest",
    isRest: true
  },
  recreational: {
    label: "Recreational / Sports",
    dayName: "Swap Day",
    isFreeform: true,
    cardio: {name:"Recreational activity", detail:"Swapped in for a lift day — log what you played instead."}
  }
};

const SESSION_ORDER = ["monday","wednesday","weekend","recovery","rest","kettlebell","recreational"];
// Workout pre-selected for an empty day, indexed by getDay() (0 = Sun). Off days
// (Tue/Thu/Fri) get the split session that most recently came before them.
const DEFAULT_WORKOUT_BY_DOW = ["weekend","monday","monday","wednesday","wednesday","wednesday","weekend"];
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ---------- Date helpers ----------
function pad(n){return n.toString().padStart(2,"0");}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addDays(d, n){
  const x = new Date(d);
  x.setDate(x.getDate() + n); // calendar math, safe across DST changes
  return x;
}
function startOfWeek(d){
  const sunday = addDays(d, -d.getDay()); // Sunday as start
  sunday.setHours(0,0,0,0);
  return sunday;
}
function formatNice(d){
  return d.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric"});
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const today = new Date();
let selectedDate = new Date(today);
let viewWeekStart = startOfWeek(today);
let allSessions = []; // {key, dateKey, sessionType, data}

// ---------- Storage helpers ----------
// Drop-in for the artifact-only window.storage API: same async methods and
// return shapes ({key, value} / {keys}), same keys (session:YYYY-MM-DD_type),
// values stored as the same JSON strings. Inside a Claude.ai artifact the real
// window.storage is used, so existing artifact data stays visible (and can be
// exported); everywhere else it is backed by localStorage.
const store = (()=>{
  if(window.storage) return window.storage;
  function localStorageUsable(){
    try{
      const probe = "__storage_probe__";
      window.localStorage.setItem(probe, probe);
      window.localStorage.removeItem(probe);
      return true;
    }catch(e){ return false; }
  }
  if(!localStorageUsable()){
    // No persistence available: app still renders, saves report failure.
    return {
      async get(){ return null; },
      async set(){ return null; },
      async delete(){ return null; },
      async list(){ return {keys:[]}; }
    };
  }
  const ls = window.localStorage;
  return {
    async get(key){
      const value = ls.getItem(key);
      return value === null ? null : {key, value};
    },
    async set(key, value){
      try{
        ls.setItem(key, value);
        return {key, value};
      }catch(e){ return null; } // quota exceeded / storage disabled
    },
    async delete(key){
      ls.removeItem(key);
      return {key, deleted:true};
    },
    async list(prefix=""){
      const keys = [];
      for(let i=0;i<ls.length;i++){
        const k = ls.key(i);
        if(k !== null && k.startsWith(prefix)) keys.push(k);
      }
      return {keys};
    }
  };
})();

const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function isSessionRecord(v){
  return !!v && typeof v === "object" && typeof v.dateKey === "string" && DATE_KEY_RE.test(v.dateKey)
    && typeof v.sessionType === "string" && v.sessionType !== "";
}

async function loadAllSessions(){
  try{
    const listRes = await store.list("session:");
    if(!listRes || !listRes.keys || listRes.keys.length===0){ allSessions = []; return; }
    const results = [];
    for(const k of listRes.keys){
      try{
        const r = await store.get(k);
        if(r && r.value){
          const parsed = JSON.parse(r.value);
          if(!isSessionRecord(parsed)) continue;
          results.push({key:k, dateKey:parsed.dateKey, sessionType:parsed.sessionType, data:parsed});
        }
      }catch(e){ /* skip unreadable key */ }
    }
    results.sort((a,b)=> b.dateKey.localeCompare(a.dateKey));
    allSessions = results;
  }catch(e){
    allSessions = [];
  }
}

// ---------- Haptics ----------
// Android: Vibration API. iPhone (Safari has no vibrate): toggling a native
// <input type="checkbox" switch> plays the system haptic on iOS 18+, so click
// a throwaway hidden one. Older iOS / desktop: silently does nothing.
function haptic(){
  try{
    if(typeof navigator.vibrate === "function" && navigator.vibrate(10)) return;
  }catch(e){}
  try{
    const label = document.createElement("label");
    label.setAttribute("aria-hidden", "true");
    label.style.display = "none";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.setAttribute("switch", "");
    label.appendChild(input);
    document.head.appendChild(label);
    label.click();
    label.remove();
  }catch(e){}
}

// Tap and press-and-hold on one element. A hold fires onLongPress (once) and
// swallows the click that follows; moving the finger cancels the hold.
const LONG_PRESS_MS = 450;
function attachPress(el, holder, {onTap, onLongPress}){
  let timer = null, startX = 0, startY = 0, fired = false;
  const cancel = ()=>{ clearTimeout(timer); timer = null; holder.classList.remove("pressing"); };
  el.addEventListener("pointerdown", (e)=>{
    if(e.button !== 0) return;
    fired = false;
    startX = e.clientX; startY = e.clientY;
    holder.classList.add("pressing");
    timer = setTimeout(()=>{ timer = null; holder.classList.remove("pressing"); fired = true; onLongPress(); }, LONG_PRESS_MS);
  });
  el.addEventListener("pointermove", (e)=>{
    if(timer && Math.hypot(e.clientX-startX, e.clientY-startY) > 10) cancel();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t, cancel));
  el.addEventListener("contextmenu", (e)=>e.preventDefault()); // no long-press menu
  el.addEventListener("click", ()=>{
    if(fired){ fired = false; return; }
    onTap();
  });
}

// ---------- Rendering: header (day pills = daily log, workout pills = what was done) ----------
function sessionsOn(dk){
  return allSessions.filter(s=>s.dateKey===dk);
}
// A day with saved sessions opens on the first one logged; an empty day opens
// on its scheduled workout.
function defaultWorkoutFor(d){
  const logged = new Set(sessionsOn(dateKey(d)).map(s=>s.sessionType));
  return SESSION_ORDER.find(t=>logged.has(t)) || DEFAULT_WORKOUT_BY_DOW[d.getDay()];
}

function selectDay(d){
  haptic();
  selectedDate = new Date(d);
  viewWeekStart = startOfWeek(selectedDate);
  currentSessionType = defaultWorkoutFor(selectedDate);
  hardcoreMode = false; // always reset to the default view when switching days
  renderHeader();
  renderTodayForm();
  switchTab("today");
}

function selectWorkout(type){
  haptic();
  currentSessionType = type;
  hardcoreMode = false;
  renderHeader();
  renderTodayForm();
  switchTab("today");
}

function shiftWeek(n){
  haptic();
  viewWeekStart = addDays(viewWeekStart, 7*n);
  renderHeader();
}

function renderHeader(){
  document.getElementById("todayLabel").textContent = formatNice(today);
  const todayKey = dateKey(today);
  const selKey = dateKey(selectedDate);

  const strip = document.getElementById("weekStrip");
  strip.innerHTML = "";
  for(let i=0;i<7;i++){
    const d = addDays(viewWeekStart, i);
    const dk = dateKey(d);
    const pill = document.createElement("div");
    pill.className = "week-pill";
    pill.dataset.date = dk;
    if(sessionsOn(dk).length) pill.classList.add("done");
    if(dk===selKey) pill.classList.add("selected");
    if(dk===todayKey) pill.classList.add("is-today");
    pill.innerHTML = `<div class="dow">${DOW_SHORT[d.getDay()]}</div><div class="dom">${d.getDate()}</div>`;
    pill.addEventListener("click", ()=>selectDay(d));
    strip.appendChild(pill);
  }

  const logged = new Set(sessionsOn(selKey).map(s=>s.sessionType));
  const select = document.getElementById("workoutSelect");
  select.innerHTML = SESSION_ORDER.map(type=>
    `<option value="${type}">${PROGRAM[type].label}${logged.has(type) ? " ✓" : ""}</option>`).join("");
  select.value = currentSessionType;

  const label = document.getElementById("loggingForLabel");
  if(label){
    const prog = PROGRAM[currentSessionType];
    const isToday = selKey === todayKey;
    label.textContent = `${prog.label} · ${isToday ? "today, " : ""}${formatNice(selectedDate)}`;
  }
}

// ---------- Today tab ----------
let currentSessionType = DEFAULT_WORKOUT_BY_DOW[today.getDay()];
let hardcoreMode = false;

function existingSessionFor(type){
  const k = dateKey(selectedDate);
  return allSessions.find(s=>s.dateKey===k && s.sessionType===type);
}

// Hardcore adds a set to "N × reps" prescriptions; timed flows ("10 min") stay as is.
function bumpReps(reps){
  return reps.replace(/^(\d+)(?=\s*×)/, m => (parseInt(m,10)+1));
}

// Weights you can actually pick up, per equipment type (lb).
const LOAD_STEPS = {
  db: [2,3,5,8,10,12,15, ...Array.from({length:17}, (_,i)=>20+i*5)],   // 20 … 100 by 5
  kb: [5,10,15,20,25,30,35,40,45,50,53,60,70,80],
  machine: Array.from({length:60}, (_,i)=>5+i*5),                      // stack pins, 5 … 300
  cable: Array.from({length:40}, (_,i)=>5+i*5)                         // 5 … 200
};
// Hardcore "go heavier": the next real weight up for that equipment.
function nextLoad(ex){
  const steps = LOAD_STEPS[ex.equip];
  if(!steps || ex.start===null) return null;
  return steps.find(w=>w > ex.start) ?? null;
}

function renderTodayForm(){
  const prog = PROGRAM[currentSessionType];
  const existing = existingSessionFor(currentSessionType);

  const toggle = document.getElementById("hardcoreToggle");
  const hcLabel = document.getElementById("hardcoreLabel");
  const restNote = document.getElementById("restNote");
  const cardioCard = document.getElementById("cardioCard");
  const exCard = document.getElementById("exerciseCard");

  if(currentSessionType === "recovery"){
    restNote.style.display = "block";
    restNote.textContent = "Flexible day — log recovery here whenever you take it.";
  } else if(currentSessionType === "recreational" || currentSessionType === "kettlebell"){
    restNote.style.display = "block";
    restNote.textContent = currentSessionType === "recreational"
      ? "Swapped in for today's lift — log what you played instead."
      : "Swapped in for a kettlebell + mat only gym session.";
  } else {
    restNote.style.display = "none";
  }

  // Rest day: nothing to do but mark the day.
  if(prog.isRest){
    toggle.style.display = "none";
    cardioCard.style.display = "none";
    exCard.innerHTML = `
      <div class="section-label">Rest day</div>
      <div class="rest-body">No training planned. Recover, sleep, eat well. Save to mark the day as rested.</div>
    `;
    document.getElementById("savedNote").textContent = existing ? "Rest day logged ✓" : "";
    return;
  }

  // Recreational mode has no fixed exercise list — render a freeform log instead
  if(prog.isFreeform){
    toggle.style.display = "none";
    cardioCard.style.display = "none";
    const prevAct = existing ? existing.data.activity || {} : {};
    exCard.innerHTML = `
      <div class="section-label">Recreational Activity</div>
      <div class="rec-field">
        <label class="field-label">What did you play?</label>
        <input type="text" id="recActivity" placeholder="e.g. pickup basketball, soccer, tennis" value="${esc(prevAct.name)}">
      </div>
      <div class="rec-field">
        <label class="field-label">Duration (minutes)</label>
        <input type="number" inputmode="decimal" id="recDuration" placeholder="60" value="${esc(prevAct.duration)}">
      </div>
      <div class="rec-field">
        <label class="field-label">Intensity</label>
        <select id="recIntensity">
          <option value="light" ${prevAct.intensity==="light"?"selected":""}>Light</option>
          <option value="moderate" ${!prevAct.intensity || prevAct.intensity==="moderate"?"selected":""}>Moderate</option>
          <option value="hard" ${prevAct.intensity==="hard"?"selected":""}>Hard</option>
        </select>
      </div>
      <div class="cardio-check-row">
        <label class="field-label" style="margin:0;">Completed</label>
        <label class="check-wrap">
          <input type="checkbox" id="recCompleted" ${prevAct.completed ? "checked":""}>
          <span class="checkmark"></span>
        </label>
      </div>
    `;
    document.getElementById("savedNote").textContent = existing ? "Loaded saved log for this day — edit and re-save anytime." : "";
    return;
  }

  toggle.style.display = "flex";
  cardioCard.style.display = "block";
  toggle.classList.toggle("on", hardcoreMode);
  hcLabel.textContent = hardcoreMode ? "Hardcore Mode — on, extra sets + heavier loads" : "Hardcore Mode — off";

  exCard.innerHTML = `<div class="section-label">Exercises${hardcoreMode ? ' <span class="hc-badge">🔥 HARDCORE</span>' : ''}</div>`;
  prog.exercises.forEach(ex=>{
    const prevLogged = existing ? ((existing.data.exercises||[]).find(e=>e.id===ex.id)||{}) : {};
    const displayReps = hardcoreMode ? bumpReps(ex.reps) : ex.reps;
    // Guide load from the program; Hardcore nudges it up instead of tracking weights.
    let loadHint = "";
    if(ex.start!==null && ex.unit!=="sec"){
      const heavier = nextLoad(ex);
      loadHint = hardcoreMode && heavier!==null
        ? ` · <span class="hc-hint">go heavier: ${heavier} lb</span>`
        : ` · ~${ex.start} lb`;
    }
    const checked = prevLogged.completed ? "checked" : "";
    const guide = guideFor(ex.name);
    const item = document.createElement("div");
    item.className = "exercise-item";
    item.innerHTML = `
      <div class="exercise-row">
        <div class="exercise-info"${guide ? ` role="button" tabindex="0" aria-expanded="false" aria-controls="howto-${ex.id}"` : ""}>
          <div class="exercise-name">${ex.name}${guide ? '<span class="howto-chev" aria-hidden="true">▾</span>' : ""}</div>
          <div class="exercise-target">${displayReps}${loadHint}</div>
        </div>
        <div class="exercise-controls">
          <label class="check-wrap">
            <input type="checkbox" class="done-check" data-id="${ex.id}" ${checked}>
            <span class="checkmark"></span>
          </label>
        </div>
      </div>
      ${guide ? `<div class="howto" id="howto-${ex.id}" hidden>${guideFigure(guide, "howto-fig")}
        <div class="howto-text">
          <div class="howto-works">Works: ${guide.works}</div>
          <div class="howto-cue">${guide.cue}</div>
        </div>
      </div>` : ""}
    `;
    if(guide){
      const info = item.querySelector(".exercise-info");
      const panel = item.querySelector(".howto");
      const toggle = ()=>{
        const open = panel.hidden;
        panel.hidden = !open;
        item.classList.toggle("open", open);
        info.setAttribute("aria-expanded", String(open));
      };
      attachPress(info, item, {
        onTap: ()=>{ haptic(); toggle(); },
        onLongPress: ()=>{ haptic(); toggle(); }
      });
      info.addEventListener("keydown", (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); toggle(); } });
    }
    exCard.appendChild(item);
  });

  const prevCardio = existing ? existing.data.cardio || {} : {};
  cardioCard.innerHTML = `
    <div class="section-label">Cardio finisher</div>
    <div class="cardio-box">
      <div class="cardio-title">${prog.cardio.name}</div>
      <div class="cardio-detail">${prog.cardio.detail}${hardcoreMode ? '<br><b style="color:var(--fire)">🔥 Hardcore add-on:</b> tack on 5 extra minutes, or bump pace/incline/resistance one notch.' : ''}</div>
      <div class="cardio-check-row">
        <label class="field-label" style="margin:0;">Completed</label>
        <label class="check-wrap">
          <input type="checkbox" id="cardioCheck" ${prevCardio.completed ? "checked":""}>
          <span class="checkmark"></span>
        </label>
      </div>
    </div>
  `;
  document.getElementById("savedNote").textContent = existing ? "Loaded saved log for this day — edit and re-save anytime." : "";
}

async function saveToday(){
  const prog = PROGRAM[currentSessionType];
  const dk = dateKey(selectedDate);
  let sessionObj;

  if(prog.isRest){
    sessionObj = {
      dateKey: dk,
      dateDisplay: formatNice(selectedDate),
      sessionType: currentSessionType,
      dayLabel: prog.label,
      hardcore: false,
      exercises: [],
      cardio: {name: "Rest", completed: true},
      savedAt: new Date().toISOString()
    };
  } else if(prog.isFreeform){
    const activity = {
      name: document.getElementById("recActivity").value || "Activity",
      duration: document.getElementById("recDuration").value === "" ? null : Number(document.getElementById("recDuration").value),
      intensity: document.getElementById("recIntensity").value,
      completed: document.getElementById("recCompleted").checked
    };
    sessionObj = {
      dateKey: dk,
      dateDisplay: formatNice(selectedDate),
      sessionType: currentSessionType,
      dayLabel: `${prog.label} — ${activity.name}`,
      hardcore: false,
      exercises: [],
      activity,
      cardio: {name: prog.cardio.name, completed: activity.completed},
      savedAt: new Date().toISOString()
    };
  } else {
    // Weights are no longer entered; `weight` stays in the record (null for new
    // logs) so the data shape is unchanged and re-saving an old day keeps its weights.
    const existing = existingSessionFor(currentSessionType);
    const exercises = prog.exercises.map(ex=>{
      const check = document.querySelector(`.done-check[data-id="${ex.id}"]`);
      const prev = existing ? (existing.data.exercises||[]).find(e=>e.id===ex.id) : null;
      return {
        id: ex.id,
        name: ex.name,
        weight: prev && prev.weight!==undefined ? prev.weight : null,
        completed: check.checked
      };
    });
    const cardio = {
      name: prog.cardio.name,
      completed: document.getElementById("cardioCheck").checked
    };
    sessionObj = {
      dateKey: dk,
      dateDisplay: formatNice(selectedDate),
      sessionType: currentSessionType,
      dayLabel: prog.label,
      hardcore: hardcoreMode,
      exercises,
      cardio,
      savedAt: new Date().toISOString()
    };
  }

  const key = `session:${dk}_${currentSessionType}`;
  try{
    const res = await store.set(key, JSON.stringify(sessionObj));
    if(res){
      document.getElementById("savedNote").textContent = "Saved ✓";
      await loadAllSessions();
      renderHeader();
      renderHistory();
      renderTrend();
    } else {
      document.getElementById("savedNote").textContent = "Couldn't save — try again.";
    }
  }catch(e){
    document.getElementById("savedNote").textContent = "Couldn't save — try again.";
  }
}

// ---------- History tab ----------
function renderHistory(){
  const card = document.getElementById("historyCard");
  if(allSessions.length===0){
    card.innerHTML = `<div class="empty-state">No sessions logged yet. Save today's workout to start your history.</div>`;
    return;
  }
  card.innerHTML = "";
  allSessions.forEach((s, idx)=>{
    const d = s.data;
    const isRec = s.sessionType === "recreational";
    const exercises = Array.isArray(d.exercises) ? d.exercises : [];
    const cardioDone = !!(d.cardio && d.cardio.completed);
    const act = d.activity || {};
    const hasDuration = act.duration!==null && act.duration!==undefined && act.duration!=="";
    const totalEx = exercises.length;
    const doneEx = exercises.filter(e=>e.completed).length;
    const item = document.createElement("div");
    item.className = "hist-item";
    const detailsId = `hist-details-${idx}`;
    const recBits = [hasDuration ? `${esc(act.duration)} min` : "", esc(act.intensity)].filter(Boolean).join(" · ");
    const isRest = s.sessionType === "rest";
    const summaryHtml = isRest
      ? "Rest ✓"
      : isRec
      ? `${recBits ? recBits+"<br>" : ""}${cardioDone ? "✓ done" : "—"}`
      : `${doneEx}/${totalEx} exercises<br>cardio ${cardioDone ? "✓" : "—"}`;
    const detailsHtml = isRest
      ? `<div class="hist-row"><span>Rest day</span><span>no training</span></div>`
      : isRec
      ? `<div class="hist-row"><span>Activity</span><span>${act.name ? esc(act.name) : "—"}</span></div>
         <div class="hist-row"><span>Duration</span><span>${hasDuration ? esc(act.duration)+" min" : "—"}</span></div>
         <div class="hist-row"><span>Intensity</span><span>${act.intensity ? esc(act.intensity) : "—"}</span></div>`
      : exercises.map(e=>{
          const hasWeight = e.weight!==null && e.weight!==undefined && e.weight!=="";
          return `<div class="hist-row"><span>${esc(e.name)}</span><span>${hasWeight ? esc(e.weight)+" lb · " : ""}${e.completed ? "✓" : "—"}</span></div>`;
        }).join("");
    item.innerHTML = `
      <div class="hist-top" data-toggle="${detailsId}">
        <div>
          <div class="hist-day">${esc(d.dayLabel)}${d.hardcore ? ' <span class="hc-badge">🔥</span>' : ''}</div>
          <div class="hist-date">${esc(d.dateDisplay)}</div>
        </div>
        <div class="hist-summary">${summaryHtml}</div>
      </div>
      <div class="hist-details" id="${detailsId}">
        ${detailsHtml}
      </div>
    `;
    card.appendChild(item);
  });
  card.querySelectorAll(".hist-top").forEach(el=>{
    el.addEventListener("click", ()=>{
      const target = document.getElementById(el.getAttribute("data-toggle"));
      target.classList.toggle("open");
    });
  });
}

// ---------- Trend tab: consistency ----------
const TREND_WEEKS = 8;
const WEEKLY_GOAL = 4; // 3 full-body days + 1 recovery
const COMPLETION_WINDOW = 4;

function weeklyCounts(){
  const thisWeek = startOfWeek(today);
  const weeks = [];
  for(let i=TREND_WEEKS-1;i>=0;i--){
    const start = addDays(thisWeek, -7*i);
    const startKey = dateKey(start), endKey = dateKey(addDays(start, 7));
    const count = allSessions.filter(s=>s.dateKey>=startKey && s.dateKey<endKey && s.sessionType!=="rest").length;
    weeks.push({start, count, current: i===0});
  }
  return weeks;
}

function weeklyChartHtml(weeks){
  const w = 320, h = 150, padX = 4, top = 18, bottom = 22;
  const plotH = h - top - bottom, base = h - bottom;
  const maxY = Math.max(WEEKLY_GOAL, ...weeks.map(x=>x.count));
  const slot = (w - padX*2) / weeks.length, barW = 22;
  const y = v => base - (v / maxY) * plotH;
  const maxCount = Math.max(...weeks.map(x=>x.count));
  const maxIdx = weeks.findIndex(x=>x.count===maxCount);
  let marks = "", labels = "", hits = "";
  weeks.forEach((wk, i)=>{
    const cx = padX + slot*i + slot/2, x = cx - barW/2;
    const md = `${wk.start.getMonth()+1}/${wk.start.getDate()}`;
    if(wk.count > 0){
      const yt = y(wk.count), r = Math.min(4, base - yt);
      marks += `<path d="M${x} ${base} V${yt+r} Q${x} ${yt} ${x+r} ${yt} H${x+barW-r} Q${x+barW} ${yt} ${x+barW} ${yt+r} V${base} Z" fill="${ACCENT}"/>`;
    }
    // Label only this week and the best week; the tooltip carries the rest.
    if(wk.count > 0 && (wk.current || i===maxIdx)){
      labels += `<text x="${cx}" y="${y(wk.count)-5}" text-anchor="middle" font-size="11" fill="var(--text)">${wk.count}</text>`;
    }
    labels += `<text x="${cx}" y="${h-6}" text-anchor="middle" font-size="10" fill="${wk.current ? "var(--text)" : "var(--text-muted)"}">${wk.current ? "This wk" : md}</text>`;
    const tip = `Week of ${formatShort(wk.start)}: ${wk.count} session${wk.count===1?"":"s"}`;
    hits += `<rect class="hit" x="${padX + slot*i}" y="0" width="${slot}" height="${base}" data-tip="${esc(tip)}" data-x="${cx}" data-y="${y(wk.count)}" aria-label="${esc(tip)}"><title>${esc(tip)}</title></rect>`;
  });
  const goalY = y(WEEKLY_GOAL);
  return `
    <div class="chart-box" id="weeklyChart">
      <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Sessions per week, last ${TREND_WEEKS} weeks">
        <line x1="${padX}" x2="${w-padX}" y1="${base}" y2="${base}" stroke="var(--border)" stroke-width="1"/>
        <line x1="${padX}" x2="${w-padX}" y1="${goalY}" y2="${goalY}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
        ${marks}${labels}${hits}
      </svg>
      <div class="chart-tip"></div>
    </div>
    <details class="trend-table">
      <summary>Show as table</summary>
      <table>${weeks.slice().reverse().map(wk=>`<tr><td>${wk.current ? "This week" : "Week of "+formatShort(wk.start)}</td><td>${wk.count}</td></tr>`).join("")}</table>
    </details>`;
}

function wireChartTips(box){
  const tip = box.querySelector(".chart-tip");
  const svg = box.querySelector("svg");
  const show = (rect)=>{
    const scale = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
    tip.textContent = rect.dataset.tip;
    tip.style.left = `${Number(rect.dataset.x) * scale}px`;
    tip.style.top = `${Math.max(0, Number(rect.dataset.y) * scale - 8)}px`;
    tip.style.display = "block";
  };
  box.querySelectorAll(".hit").forEach(rect=>{
    rect.addEventListener("pointerenter", ()=>show(rect));
    rect.addEventListener("pointerdown", ()=>show(rect));
    rect.addEventListener("pointerleave", (e)=>{ if(e.pointerType==="mouse") tip.style.display = "none"; });
  });
}

// Per exercise: how many of its last COMPLETION_WINDOW logged appearances were checked off.
function completionHtml(){
  let html = "";
  SESSION_ORDER.forEach(type=>{
    const prog = PROGRAM[type];
    if(!prog.exercises) return; // freeform modes have no exercise list
    const rows = prog.exercises.map(ex=>{
      const recent = [];
      for(const s of allSessions){ // newest first
        const e = (s.data.exercises||[]).find(x=>x.id===ex.id);
        if(e) recent.push(!!e.completed);
        if(recent.length===COMPLETION_WINDOW) break;
      }
      if(!recent.length) return "";
      const done = recent.filter(Boolean).length;
      return `<div class="comp-row" data-id="${ex.id}">
        <span class="comp-name">${ex.name}</span>
        <span class="comp-meter"><span style="width:${Math.round(done/recent.length*100)}%"></span></span>
        <span class="comp-count">${done}/${recent.length}</span>
      </div>`;
    }).join("");
    if(rows) html += `<div class="comp-group">${prog.label}</div>${rows}`;
  });
  return html;
}

function renderTrend(){
  const wrap = document.getElementById("trendWrap");
  if(allSessions.length===0){
    wrap.innerHTML = `<div class="card"><div class="chart-empty">Log a workout to see your consistency here.</div></div>`;
    return;
  }
  const comp = completionHtml();
  wrap.innerHTML = `
    <div class="card">
      <div class="chart-title">Sessions per week</div>
      <div class="chart-sub">Last ${TREND_WEEKS} weeks, Sunday start · dashed line = goal of ${WEEKLY_GOAL}</div>
      ${weeklyChartHtml(weeklyCounts())}
    </div>
    <div class="card">
      <div class="chart-title">Exercise completion</div>
      <div class="chart-sub">Checked off, out of the last ${COMPLETION_WINDOW} times logged</div>
      ${comp || `<div class="chart-empty">No exercises logged yet.</div>`}
    </div>`;
  wireChartTips(document.getElementById("weeklyChart"));
}

// ---------- Next Week preview ----------
function renderNextWeek(){
  const nextSun = addDays(startOfWeek(today), 7);
  const nextMon = addDays(nextSun, 1);
  const nextWed = addDays(nextSun, 3);
  const nextSat = addDays(nextSun, 6);

  const blocks = [
    {type:"monday", date: nextMon},
    {type:"wednesday", date: nextWed},
    {type:"weekend", date: null, label: `${formatShort(nextSun)} or ${formatShort(nextSat)}`},
    {type:"recovery", date: null, label: "Any open day"}
  ];

  const wrap = document.getElementById("nextWeekWrap");
  wrap.innerHTML = blocks.map(b=>{
    const prog = PROGRAM[b.type];
    const dateStr = b.date ? formatNice(b.date) : b.label;
    const exList = prog.exercises.map(ex=>{
      const ref = ex.start!==null ? `${ex.start}${ex.unit==="sec"?" sec":" lb"}` : "bodyweight";
      return `<div class="nw-ex"><b>${ex.name}</b> — ${ex.reps} · start ~${ref}</div>`;
    }).join("");
    return `
      <div class="nw-card">
        <div class="nw-top">
          <div class="nw-day">${prog.dayName} — ${prog.label}</div>
          <div class="nw-date">${dateStr}</div>
        </div>
        ${exList}
        <div class="nw-cardio"><b style="color:var(--text)">${prog.cardio.name}:</b> ${prog.cardio.detail}</div>
      </div>
    `;
  }).join("");
}
function formatShort(d){
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}

// ---------- Backup: export / import ----------
const BACKUP_FORMAT = "training-log-backup";
const SESSION_KEY_RE = /^session:(\d{4}-\d{2}-\d{2})_(.+)$/;

function setBackupNote(msg, isError){
  const note = document.getElementById("backupNote");
  note.textContent = msg;
  note.style.color = isError ? "var(--fire)" : "";
}

async function buildBackup(){
  await loadAllSessions();
  const sessions = {};
  allSessions.slice().reverse().forEach(s=>{ sessions[s.key] = s.data; });
  return {format: BACKUP_FORMAT, version: 1, exportedAt: new Date().toISOString(), sessions};
}

async function exportFile(){
  const backup = await buildBackup();
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `training-log-backup-${dateKey(today)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  const n = Object.keys(backup.sessions).length;
  setBackupNote(`Exported ${n} session${n===1?"":"s"}. No file? Use Copy JSON instead.`);
}

async function copyBackup(){
  const backup = await buildBackup();
  const json = JSON.stringify(backup);
  const n = Object.keys(backup.sessions).length;
  try{
    await navigator.clipboard.writeText(json);
    setBackupNote(`Copied ${n} session${n===1?"":"s"} to the clipboard.`);
  }catch(e){
    // Clipboard is often blocked in sandboxed frames: hand over the text instead.
    const box = document.getElementById("backupText");
    box.value = json;
    box.focus();
    box.select();
    setBackupNote("Clipboard blocked here — the backup is in the box above, select all and copy it.");
  }
}

// Accepts this app's backup file, or a bare {"session:…": value} map where each
// value is a session object or its JSON string. Newer savedAt wins on conflict.
async function importBackup(text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ setBackupNote("That isn't valid JSON — nothing imported.", true); return; }
  const map = parsed && parsed.format===BACKUP_FORMAT ? parsed.sessions : parsed;
  if(!map || typeof map !== "object" || Array.isArray(map)){
    setBackupNote("No sessions found in that backup.", true);
    return;
  }
  let added = 0, updated = 0, kept = 0, invalid = 0, failed = 0;
  for(const [key, raw] of Object.entries(map)){
    let rec = raw;
    if(typeof rec === "string"){ try{ rec = JSON.parse(rec); }catch(e){ rec = null; } }
    const m = SESSION_KEY_RE.exec(key);
    if(!m || !isSessionRecord(rec) || rec.dateKey!==m[1] || rec.sessionType!==m[2]){ invalid++; continue; }
    const current = allSessions.find(s=>s.key===key);
    if(current && current.data.savedAt && rec.savedAt && String(current.data.savedAt) >= String(rec.savedAt)){ kept++; continue; }
    const res = await store.set(key, JSON.stringify(rec));
    if(!res){ failed++; continue; }
    if(current) updated++; else added++;
  }
  await loadAllSessions();
  currentSessionType = defaultWorkoutFor(selectedDate);
  hardcoreMode = false;
  renderHeader();
  renderTodayForm();
  renderHistory();
  renderTrend();
  const parts = [`${added} added`, `${updated} updated`];
  if(kept) parts.push(`${kept} kept (local copy same or newer)`);
  if(invalid) parts.push(`${invalid} skipped (invalid)`);
  if(failed) parts.push(`${failed} failed to save`);
  setBackupNote(`Import done: ${parts.join(", ")}.`, failed>0 || (added+updated===0 && invalid>0));
}

async function init(){
  await loadAllSessions();
  currentSessionType = defaultWorkoutFor(selectedDate);
  hardcoreMode = false;
  renderTodayForm();
  renderHeader();
  renderNextWeek();
  renderGuide();
  renderHistory();
  renderTrend();
  document.getElementById("saveBtn").addEventListener("click", ()=>{ haptic(); saveToday(); });
  // Check-offs (exercises, cardio, recreational "Completed"); the cards' contents
  // are re-rendered, so listen on the cards themselves.
  ["exerciseCard","cardioCard"].forEach(id=>{
    document.getElementById(id).addEventListener("change", (e)=>{
      if(e.target.matches('input[type="checkbox"]')) haptic();
    });
  });
  document.getElementById("workoutSelect").addEventListener("change", (e)=>selectWorkout(e.target.value));
  document.getElementById("prevWeek").addEventListener("click", ()=>shiftWeek(-1));
  document.getElementById("nextWeek").addEventListener("click", ()=>shiftWeek(1));
  document.getElementById("exportBtn").addEventListener("click", exportFile);
  document.getElementById("copyBtn").addEventListener("click", copyBackup);
  document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    await importBackup(await file.text());
    e.target.value = "";
  });
  document.getElementById("importPasteBtn").addEventListener("click", ()=>{
    const text = document.getElementById("backupText").value.trim();
    if(!text){ setBackupNote("Paste a backup into the box first.", true); return; }
    importBackup(text);
  });
  document.getElementById("hardcoreToggle").addEventListener("click", ()=>{
    haptic();
    // Same day + workout, just a different view: keep unsaved check-offs.
    const checks = {};
    document.querySelectorAll(".done-check").forEach(c=>{ checks[c.dataset.id] = c.checked; });
    const cardio = document.getElementById("cardioCheck");
    const cardioDone = cardio ? cardio.checked : null;
    hardcoreMode = !hardcoreMode;
    renderTodayForm();
    document.querySelectorAll(".done-check").forEach(c=>{
      if(c.dataset.id in checks) c.checked = checks[c.dataset.id];
    });
    const cardioAfter = document.getElementById("cardioCheck");
    if(cardioAfter && cardioDone !== null) cardioAfter.checked = cardioDone;
  });
}
init();
